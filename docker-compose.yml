# Database only. The API and web app run on the host via npm scripts.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskboard -d taskboard']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
